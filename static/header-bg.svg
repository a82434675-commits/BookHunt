<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <rect width="1200" height="300" fill="#f6f4ee"/>

  <!-- Soft window light glow -->
  <ellipse cx="1000" cy="60" rx="260" ry="180" fill="#e4efee" opacity="0.6"/>

  <g opacity="0.9">

    <!-- Desk surface -->
    <rect x="0" y="230" width="1200" height="70" fill="#dcd8cc" opacity="0.5"/>

    <!-- Stack of books (left) -->
    <g transform="translate(90,150)">
      <rect x="0" y="60" width="140" height="26" rx="3" fill="#2f6f6d"/>
      <rect x="10" y="32" width="120" height="26" rx="3" fill="#b3492f"/>
      <rect x="0" y="4" width="130" height="26" rx="3" fill="#5b6472"/>
    </g>

    <!-- Small plant (left) -->
    <g transform="translate(60,120)">
      <path d="M20 90 L26 90 L24 60 Z" fill="#8a8370"/>
      <path d="M23 60 C 5 55, 0 30, 15 15 C 20 35, 22 48, 23 60 Z" fill="#2f6f6d"/>
      <path d="M23 60 C 40 50, 45 25, 32 10 C 28 30, 25 48, 23 60 Z" fill="#3d8582"/>
      <path d="M23 60 C 15 45, 20 35, 23 25 C 27 35, 28 48, 23 60 Z" fill="#2f6f6d"/>
    </g>

    <!-- Open book (center) -->
    <g transform="translate(430,175)">
      <path d="M0 8 C 50 -8, 90 -8, 130 8 L130 55 C 90 40, 50 40, 0 55 Z" fill="#ffffff" stroke="#dcd8cc" stroke-width="2"/>
      <path d="M130 8 C 170 -8, 210 -8, 260 8 L260 55 C 210 40, 170 40, 130 55 Z" fill="#ffffff" stroke="#dcd8cc" stroke-width="2"/>
      <line x1="20" y1="18" x2="105" y2="8" stroke="#dcd8cc" stroke-width="2"/>
      <line x1="20" y1="30" x2="105" y2="20" stroke="#dcd8cc" stroke-width="2"/>
      <line x1="20" y1="42" x2="105" y2="32" stroke="#dcd8cc" stroke-width="2"/>
      <line x1="155" y1="8" x2="240" y2="18" stroke="#dcd8cc" stroke-width="2"/>
      <line x1="155" y1="20" x2="240" y2="30" stroke="#dcd8cc" stroke-width="2"/>
      <line x1="155" y1="32" x2="240" y2="42" stroke="#dcd8cc" stroke-width="2"/>
    </g>

    <!-- Desk lamp (right of book) -->
    <g transform="translate(760,90)">
      <rect x="18" y="120" width="10" height="10" fill="#5b6472"/>
      <line x1="23" y1="120" x2="23" y2="60" stroke="#5b6472" stroke-width="5"/>
      <line x1="23" y1="60" x2="70" y2="30" stroke="#5b6472" stroke-width="5"/>
      <path d="M55 22 L90 12 L100 40 L62 42 Z" fill="#b3492f"/>
      <ellipse cx="80" cy="55" rx="35" ry="14" fill="#f7d9a0" opacity="0.5"/>
    </g>

    <!-- Coffee cup -->
    <g transform="translate(900,180)">
      <path d="M0 10 L40 10 L36 45 C 36 52, 4 52, 4 45 Z" fill="#ffffff" stroke="#dcd8cc" stroke-width="2"/>
      <path d="M40 15 C 55 15, 55 35, 40 35" fill="none" stroke="#dcd8cc" stroke-width="3"/>
      <ellipse cx="20" cy="10" rx="20" ry="5" fill="#5b6472"/>
      <path d="M14 -6 C 10 -10, 16 -14, 12 -20" fill="none" stroke="#5b6472" stroke-width="2" opacity="0.5"/>
      <path d="M24 -6 C 20 -10, 26 -14, 22 -20" fill="none" stroke="#5b6472" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- Loose papers (right) -->
    <g transform="translate(1020,150) rotate(8)">
      <rect width="70" height="90" rx="2" fill="#ffffff" stroke="#dcd8cc" stroke-width="2"/>
      <line x1="12" y1="20" x2="58" y2="20" stroke="#dcd8cc" stroke-width="3"/>
      <line x1="12" y1="34" x2="58" y2="34" stroke="#dcd8cc" stroke-width="3"/>
      <line x1="12" y1="48" x2="45" y2="48" stroke="#dcd8cc" stroke-width="3"/>
    </g>

    <!-- Pen -->
    <g transform="translate(650,210) rotate(-25)">
      <rect width="90" height="8" rx="4" fill="#2f6f6d"/>
      <polygon points="90,0 100,4 90,8" fill="#5b6472"/>
    </g>

  </g>
</svg>