<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyMart — Verify Email</title>
<style>
  :root {
    --paper: #f6f4ee;
    --ink: #1f2937;
    --ink-soft: #5b6472;
    --line: #dcd8cc;
    --accent: #2f6f6d;
    --danger: #b3492f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
  }

  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin: 0 0 4px;
  }

  p.sub {
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin: 0 0 24px;
  }

  label {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95rem;
    margin-bottom: 16px;
    background: var(--paper);
  }

  button {
    width: 100%;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .error {
    background: #fbeae5;
    color: var(--danger);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.85rem;
    padding: 10px 12px;
    border-radius: 3px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>

<div class="box">
  <h1>Verify your email</h1>
  <p class="sub">We sent a 6-digit code to your Gmail. Enter it below.</p>

  <div id="error-box" class="error"></div>

  <form method="POST" action="/auth/verify" id="verify-form">
    <input type="hidden" id="email" name="email">

    <label for="code">Verification code</label>
    <input type="text" id="code" name="code" maxlength="6" required>

    <button type="submit">Verify & Continue</button>
  </form>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const email = params.get("email") || "";
document.getElementById("email").value = email;

const errorMsg = params.get("error");
if (errorMsg) {
  const box = document.getElementById("error-box");
  box.textContent = errorMsg;
  box.style.display = "block";
}
</script>

</body>
</html>
